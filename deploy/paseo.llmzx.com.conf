# ============================================================
#  Paseo  ·  paseo.llmzx.com
#
#  按官方文档（public-docs/web-ui.md「Reverse proxy → Nginx」）编写：
#  单个 location / 承载全部流量，WebSocket 升级头放在这里。
#
#  官方原文要求代理必须做到：
#    - 转发 WebSocket 升级（应用走 /ws，不支持升级会「页面能开但连不上」）
#    - 不缓冲响应（终端与实时流会被缓冲成「卡住」）
#    - 长读取超时（流会开一整个会话那么久）
#    - 允许大请求体（提示词与文件上传）
#    - 保留 Host 并传 X-Forwarded-Proto（daemon 靠它判断回连用 wss:// 还是 ws://）
#
#  差异说明（本机环境特有，与官方示例无关）：
#    证书复用同机已有的通配符 *.llmzx.com，而非单独签发。
#    如需恢复「只允许 Cloudflare 回源」，把文件末尾注释里的 map 段打开。
# ============================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name paseo.llmzx.com;

    location /.well-known/acme-challenge/ {
        root /www/wwwroot/paseo.llmzx.com;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name paseo.llmzx.com;

    # 复用同机通配符证书 *.llmzx.com（随 www.llmzx.com 站点续期）
    ssl_certificate     /www/server/panel/vhost/cert/www.llmzx.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/www.llmzx.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:PASEO_SSL:10m;
    ssl_session_timeout 1d;

    access_log /www/wwwlogs/paseo.llmzx.com.log;
    error_log  /www/wwwlogs/paseo.llmzx.com.error.log;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:6767;
        proxy_http_version 1.1;

        # WebSocket 升级（应用走 /ws，与 REST 同源同路径前缀）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 保留来源与协议，daemon 据此决定回连用 wss:// 还是 ws://
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # 长连接、不缓冲
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

